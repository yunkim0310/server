<ul class="css-1x9bshx ecbxmj2" th:fragment="getCommunityAside">

    <!-- 전체 리뷰 리스트는 항상 표시 -->
    <li class="css-0 ecbxmj1" th:attr="style='font-weight: '+${(type=='allList')? 'bold;': 'normal'}">
        <a class="css-pi3u6r ecbxmj0" th:href="'/review/getReviewList?type=allList'">
            전체 리뷰 리스트
            <span class="css-e41glx e1x0rfoo0"></span>
        </a>
    </li>

    <!-- 로그인 상태 및 역할에 따라 추가 메뉴 표시 -->
    <th:block th:if="${session.user != null}">
        <th:block th:if="${session.user.role == 'ROLE_USER'}">
            <!-- ROLE_USER인 경우 모든 메뉴 표시 -->
            <li class="css-0 ecbxmj1" th:attr="style='font-weight: '+${(type=='friend')? 'bold;': 'normal'}">
                <a class="css-pi3u6r ecbxmj0" href="/review/getReviewList?type=friend">
                    친구 리뷰 목록
                    <span class="css-e41glx e1x0rfoo0"></span>
                </a>
            </li>

            <li class="css-0 ecbxmj1" th:attr="style='font-weight: '+${(type=='feed' && isMyFeed)? 'bold;': 'normal'}">
                <a class="css-pi3u6r ecbxmj0" th:href="'/review/getReviewList?type=feed&friendUsername='+${session.user.username}">
                    My Feed
                    <span class="css-e41glx e1x0rfoo0"></span>
                </a>
            </li>

            <li class="css-0 ecbxmj1" th:attr="style='font-weight: '+${(type=='friendList')? 'bold;': 'normal'}">
                <a class="css-pi3u6r ecbxmj0" th:href="'/review/getFriendList'">
                    친구 목록
                    <span class="css-e41glx e1x0rfoo0"></span>
                </a>
            </li>

            <li class="css-0 ecbxmj1" th:attr="style='font-weight: '+${(type=='friendReqStatus')? 'bold;': 'normal'}">
                <a class="css-pi3u6r ecbxmj0" href="/review/getFriendReqStatus">
                    친구 요청 현황
                    <span class="css-e41glx e1x0rfoo0"></span>
                </a>
            </li>
        </th:block>
    </th:block>

</ul>
