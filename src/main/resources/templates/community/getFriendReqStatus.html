<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">

    <link th:insert="~{common/import :: importFragment}">

    <link rel="stylesheet" href="/css/templates/mypage.css">
    <link rel="stylesheet" href="/css/templates/collection_detail.css">
    <link rel="stylesheet" href="/css/templates/style.css">

    <style>
        body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #ffffff;
        }
          #root {
        display: flex; /* 사이드바와 메인 컨텐츠를 플렉스 박스로 나열 */
    }

    .sidebar {
        width: 250px; /* 사이드바 폭 조정 */
        background-color: #f4f4f4; /* 사이드바 배경색 */
        position: fixed; /* 사이드바 고정 */
        height: 100vh; /* 화면 높이에 맞게 고정 */
        overflow-y: auto; /* 내용이 넘칠 경우 스크롤 가능 */
    }

    .wrapper {
         margin-left: 14%;
         padding: 0%;
         margin-top: 5%;
         width: calc(100% - 260px);
    }

    table {
        width: 80%; /* 테이블 폭 조정 */
        margin: 20px auto; /* 테이블 가운데 정렬 */
        border-collapse: collapse; /* 테두리 겹치기 없애기 */
    }


        h1, h2 {
            color: #333;
        }

        table {
            width: 60%; /* 폭을 줄여서 중앙으로 모아짐 */
            margin: 20px auto; /* 테이블 가운데 정렬 */
            border-collapse: collapse; /* 테두리 겹치기 없애기 */
        }

        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #007bff; /* 파란색으로 변경 */
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tr:hover {
            background-color: #ddd; /* 마우스 오버 시 하이라이트 효과 */
        }

        .friend-info {
            display: flex;
            align-items: center;
            justify-content: center; /* 중앙 정렬 */
        }

        .friend-info img {
            width: 50px;
            height: 50px;
            border-radius: 50%; /* 원형 프로필로 만들기 */
            margin-right: 15px; /* 간격 조정 */
        }

        .button-container {
            display: flex;
            justify-content: center; /* 버튼 가운데 정렬 */
        }

        button {
            padding: 8px 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s; /* 배경색 변환 효과 */
        }

        button:hover {
            background-color: #0056b3;
        }

        .message {
            color: red;
            margin-bottom: 20px;
        }

        .allPage {
            margin-bottom: 30px;
        }
    </style>
</head>
<body>

<div id="root"> <!-- 전체 컨텐츠를 감싸는 루트 요소 -->
    <div class="css-833hqy ecbxmj4" style="padding-left: 10%;margin-top: 20px;position: sticky">
        <div class="side">
            <div class="css-1v4whg ecbxmj3">&nbsp;&nbsp;리뷰 목록 </div>
            <div th:replace="~{community/getCommunityAside :: getCommunityAside}"></div>
        </div>
    </div>

    <div class="wrapper" id="wrapperDiv"> <!-- 전체 리뷰 리스트를 감싸는 주 컨테이너 -->
        <main id="main">
            <section class="section mb-50">
                <div class="container gutter-sm">
                    <div class="section-body">
                        <div class="__my-review-list ml--50 mr--100"> <!-- 리뷰 리스트를 담는 컨테이너 -->
                            <div id="shopReviewListScroll"> <!-- 리뷰 스크롤을 위한 컨테이너 -->
                                <div id="shopReviewListScroll_0">

                                    <div class="allPage"> <!-- 여기에 allPage 클래스를 적용 -->
                                        <h1>친구 요청 목록</h1>

                                        <div th:if="${message}" class="message">
                                            <p th:text="${message}"></p>
                                        </div>

                                        <!-- 내가 보낸 친구 신청 목록 -->
                                        <h2>내가 보낸 친구 신청 목록</h2>

                                        <table>
                                            <thead>
                                            <tr>
                                                <th>프로필</th>
                                                <th>보낸 사람</th>
                                                <th>신청 날짜</th>
                                                <th>상태</th>
                                            </tr>
                                            </thead>
                                            <tbody>
                                            <th:block th:if="${friendRequests == null || friendRequests.isEmpty()}">
                                                <tr>
                                                    <td colspan="4">
                                                        <div style="text-align: center; padding: 10%; font-weight: bold; font-size: 18px;">
                                                            내가 보낸 친구 신청이 없습니다.
                                                        </div>
                                                    </td>
                                                </tr>
                                            </th:block>

                                            <th:block th:unless="${friendRequests == null || friendRequests.isEmpty()}">
                                                <tr th:each="request : ${friendRequests}">
                                                    <td>
                                                        <div class="friend-info">
                                                            <img id="profileImgView" th:src="${url + 'user/' + request.profileImg}" alt="프로필사진">
                                                        </div>
                                                    </td>
                                                    <td>
                                                        <a th:href="'/review/getReviewList?type=feed&friendUsername='+${request.friendRes}" th:text="${request.friendRes}"></a>
                                                    </td>
                                                    <td th:text="${request.friendDt}"></td>
                                                    <td>
                                                        <span th:if="${request.friendStatus}" th:text="'수락 됨'"></span>
                                                        <span th:if="${!request.friendStatus}">수락 대기중</span>
                                                        <!-- 친구 신청 취소를 위한 폼 -->
                                                        <div th:if="${!request.friendStatus}">
                                                            <form th:action="@{/review/removeFriendRequest}" method="post" onsubmit="return confirm('정말로 취소 하시겠습니까?');">
                                                                <input type="hidden" name="friendNo" th:value="${request.friendNo}" />
                                                                <div class="button-container">
                                                                    <button type="submit" style="margin-left:78%;">취소</button>
                                                                </div>
                                                            </form>
                                                        </div>

                                                    </td>
                                                </tr>
                                            </th:block>
                                            </tbody>
                                        </table>

                                        <!-- 내가 수신한 친구 신청 목록 -->
                                        <h2>내게 온 친구 신청 목록</h2>

                                        <table>
                                            <thead>
                                            <tr>
                                                <th>보낸 사람</th>
                                                <th>신청 날짜</th>
                                                <th>수락</th>
                                                <th>거절</th>
                                            </tr>
                                            </thead>

                                            <tbody>
                                            <th:block th:if="${receivedRequests == null || receivedRequests.isEmpty()}">
                                                <tr>
                                                    <td colspan="4">
                                                        <div style="text-align: center; padding: 10%; font-weight: bold; font-size: 18px;">
                                                            내게 온 친구 신청이 없습니다.
                                                        </div>
                                                    </td>
                                                </tr>
                                            </th:block>

                                            <th:block th:unless="${receivedRequests == null || receivedRequests.isEmpty()}">
                                                <tr th:each="request : ${receivedRequests}">
                                                    <td th:text="${request.friendReq}">
                                                        <a th:href="'/review/getReviewList?type=feed&friendUsername=' + ${request.friendRes}" th:text="${request.friendRes}"></a>
                                                    </td>
                                                    <td th:text="${request.friendDt}"></td>
                                                    <td>
                                                        <div class="button-container">
                                                            <form th:action="@{/review/addFriend}" method="post" onsubmit="return confirm('정말로 수락 하시겠습니까?');">
                                                                <input type="hidden" name="friendNo" th:value="${request.friendNo}" />
                                                                <button type="submit">수락</button>
                                                            </form>
                                                        </div>
                                                    </td>
                                                    <td>
                                                        <div class="button-container">
                                                            <form th:action="@{/review/removeFriendReq}" method="post" onsubmit="return confirm('정말로 거절 하시겠습니까?');">
                                                                <input type="hidden" name="friendNo" th:value="${request.friendNo}" />
                                                                <button type="submit">거절</button>
                                                            </form>
                                                        </div>
                                                    </td>
                                                </tr>
                                            </th:block>
                                            </tbody>
                                        </table>

                                    </div> <!-- allPage div END -->
                                </div> <!-- shopReviewListScroll_0 div END -->
                            </div> <!-- shopReviewListScroll div END -->
                        </div> <!-- __my-review-list div END -->
                    </div> <!-- section-body div END -->
                </div> <!-- container div END -->
            </section>
        </main>
    </div> <!-- wrapperDiv div END -->
</div> <!-- root div END -->

</body>
</html>
